name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --select E,F,W,I,UP,B --ignore E501 custom_components tests"

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component aioresponses
          # The sidebar page needs HA's frontend component; install the version
          # pinned by the Home Assistant release the test harness uses.
          pip install "$(python -c "import homeassistant, pathlib; c = pathlib.Path(homeassistant.__file__).with_name('package_constraints.txt'); print(next(l for l in c.read_text().splitlines() if l.startswith('home-assistant-frontend==')))")"
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend bundle is up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed bundle matches the source
        run: git diff --exit-code -- ../custom_components/audiomuse/frontend/audiomuse-panel.js
